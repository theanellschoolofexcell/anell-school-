<title>School Excursion - Anell School of Excellence</title>

<style>
:root{--black:#14101f;--red:#e12a2f;--yellow:#ffdd00}
html,body{margin:0;background:var(--black);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;border-top:6px solid var(--red);padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.w{max-width:760px;margin:0 auto}
img.f{display:block;width:100%;height:auto}
.note{margin:18px 14px 0;padding:18px 16px 20px;border-radius:18px;text-align:center;background:#fff;color:var(--black);border-bottom:6px solid var(--red);box-shadow:0 0 0 3px var(--yellow)}
.logo{height:92px;width:auto;display:block;margin:0 auto 4px}
.road{font-size:1.8rem;line-height:1;overflow:hidden;white-space:nowrap;border-bottom:3px dashed var(--yellow);padding-bottom:4px;margin-bottom:8px}
.bus{display:inline-block;animation:drive 6s linear infinite}
@keyframes drive{from{transform:translateX(-30px)}to{transform:translateX(calc(100vw))}}
.note h2{margin:6px 0 6px;font-size:1.35rem;color:var(--red)}
.note p{margin:0 auto;max-width:480px;font-size:.98rem}
.motto{display:inline-block;margin-top:12px;background:var(--black);color:var(--yellow);font-weight:800;letter-spacing:.12em;border-radius:99px;padding:5px 16px;font-size:.8rem}
.tip{text-align:center;font-size:.82rem;opacity:.8;margin:14px 14px 0}
@media (prefers-reduced-motion:reduce){.bus{animation:none}}
</style>
