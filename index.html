<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Excursion - Anell School of Excellence</title>
<meta property="og:title" content="School Excursion - Anell School of Excellence">
<meta property="og:image" content="flyer.jpg">
<style>
html,body{margin:0;background:#0b4f35;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.w{max-width:760px;margin:0 auto}
img.f{display:block;width:100%;height:auto}
.note{margin:18px 14px 0;padding:18px 16px;border-radius:18px;text-align:center;background:linear-gradient(135deg,#f4b400,#e3a91c);color:#2b2100}
.road{font-size:1.9rem;line-height:1;overflow:hidden;white-space:nowrap}
.bus{display:inline-block;animation:drive 6s linear infinite}
@keyframes drive{from{transform:translateX(-30px)}to{transform:translateX(calc(100vw))}}
.note h2{margin:8px 0 6px;font-size:1.35rem}
.note p{margin:0 auto;max-width:480px;font-size:.98rem}
.tip{text-align:center;font-size:.82rem;opacity:.85;margin:14px 14px 0}
@media (prefers-reduced-motion:reduce){.bus{animation:none}}
</style>
</head>
<body>
<div class="w">
<img class="f" src="flyer.jpg" alt="School excursion flyer - Anell School of Excellence">
<div class="note">
<div class="road"><span class="bus">&#128652;</span></div>
<h2>Get ready for an adventure! &#127890;&#10024;</h2>
<p>Pack your bag, bring your smile and get ready to explore, learn and make memories with your classmates. We can't wait to see you there! &#127775;</p>
</div>
<p class="tip">&#128269; Tip: pinch the flyer to zoom in</p>
</div>
</body>
</html>
